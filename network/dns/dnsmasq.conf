# Minimal dnsmasq configuration for Private Network Service Platform

# Listen on the default DNS port
port=53

# Use explicit upstream DNS servers; avoid system resolver loops
no-resolv
server=8.8.8.8
server=8.8.4.4

# Do not read /etc/hosts; strictly use the mappings defined below
no-hosts

# --- DNS Mappings ---
# Syntax: address=/hostname/IP_address

# Route web app traffic to Mac 1 (Standby Edge Reverse Proxy / Load Balancer)
address=/app.team1.test/10.167.6.155

# Route API traffic to Mac 1 (Standby Edge Reverse Proxy / Load Balancer)
address=/api.team1.test/10.167.6.155

# Extension B: DNS TTL demonstration
local-ttl=10
address=/ttl.team1.test/10.167.6.155
