# Minimal dnsmasq configuration for Private Network Service Platform

# Listen on the default DNS port
port=53

# Do not read /etc/hosts; strictly use the mappings defined below
no-hosts

# --- DNS Mappings ---
# Syntax: address=/hostname/IP_address

# Route web app traffic to Mac 2 (Edge Reverse Proxy / Load Balancer)
address=/app.team1.test/10.216.38.9

# Route API traffic to Mac 2 (Edge Reverse Proxy / Load Balancer)
address=/api.team1.test/10.216.38.9
