worker_processes 1;
pid /tmp/nginx-standby.pid;
error_log /tmp/nginx-standby-error.log;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/nginx-standby-access.log;

    upstream node_backends {
        server 10.167.6.155:3001 max_fails=1 fail_timeout=10s;
        server 10.167.6.29:3002 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name 10.167.6.155 localhost app.team1.test;

        location / {
            proxy_pass http://node_backends;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_header X-Backend;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
