# ==============================================================================
# NGINX Reverse Proxy & Load Balancer Configuration # Member 2 (Mac 2) - Computer Networks Project
# Edge IP: 10.216.38.9
# Ports: 80 (HTTP), 8443 (HTTPS / TLS Termination)
# ==============================================================================

events {
    # Number of simultaneous connections per worker process
    worker_connections 1024;
}

http {
    # Basic performance settings
    sendfile           on;
    keepalive_timeout  65;

    # --------------------------------------------------------------------------
    # Upstream Backend Pool
    # Defines the group of target servers for reverse proxying.
    # NGINX distributes traffic between them using default Round-Robin scheduling.
    # --------------------------------------------------------------------------
    upstream node_backends {
        # Backend A located on Mac 1 across LAN
        server 10.216.38.155:3001;

        # Backend B located on Mac 2 locally
        server 10.216.38.9:3002;
    }

    # --------------------------------------------------------------------------
    # Edge HTTP Server Block
    # Serves as the public HTTP entry point on Mac 2 (10.216.38.9:80).
    # --------------------------------------------------------------------------
    server {
        listen       80;
        server_name  10.216.38.9 localhost app.team1.test;

        # Route all incoming requests to the upstream backend pool
        location / {
            proxy_pass http://node_backends;

            # Forward appropriate Host and X-Forwarded-* headers to backends
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header X-Forwarded-Host   $host;
            proxy_set_header X-Forwarded-Port   $server_port;

            # Preserve the X-Backend response header returned by Node backends
            proxy_pass_header X-Backend;

            # Proxy connection timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }
    }

    # --------------------------------------------------------------------------
    # Edge HTTPS Server Block (TLS Termination)
    # Serves as the secure HTTPS entry point on Mac 2 (10.216.38.9:8443).
    # Handles TLS handshake, decrypts traffic, and proxies to upstream backends.
    # --------------------------------------------------------------------------
    server {
        listen       8443 ssl;
        server_name  10.216.38.9 localhost app.team1.test;

        # TLS / SSL Certificates
        ssl_certificate      /Users/harshkumar/Networks/network/tls/team1.crt;
        ssl_certificate_key  /Users/harshkumar/Networks/network/tls/team1.key;

        # Route all secure HTTPS requests to the shared upstream backend pool
        location / {
            proxy_pass http://node_backends;

            # Forward appropriate Host and X-Forwarded-* headers to backends
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header X-Forwarded-Host   $host;
            proxy_set_header X-Forwarded-Port   $server_port;

            # Preserve the X-Backend response header returned by Node backends
            proxy_pass_header X-Backend;

            # Proxy connection timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }
    }
}
